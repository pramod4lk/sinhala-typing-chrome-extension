<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sinhala Typing</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="mark" src="../icons/icon128.png" alt="" width="32" height="32">
    <div class="titles">
      <h1>Singlish</h1>
      <p id="status" class="status"><span class="dot"></span><span id="status-text">Typing on pages</span></p>
    </div>
    <kbd class="shortcut" title="Turn typing on web pages on or off">Alt+Shift+S</kbd>
  </header>

  <main>
    <textarea id="src" rows="2" placeholder="mama gedhara yanavaa" autocomplete="off" spellcheck="false" aria-label="Singlish text"></textarea>

    <div class="out-card">
      <div id="out" class="out si" lang="si" aria-live="polite"></div>
      <div class="actions">
        <button id="clear" class="ghost" type="button" title="Clear">Clear</button>
        <button id="copy" class="primary" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>
          <span id="copy-label">Copy</span>
        </button>
      </div>
    </div>

    <details id="keys">
      <summary>Keys</summary>
      <div id="vowels" class="grid"></div>
      <div id="consonants" class="grid"></div>
      <p class="note">Case matters · <code>kya</code> ක්‍ය · <code>kra</code> ක්‍ර · <code>x</code> ං · <code>H</code> ඃ</p>
    </details>
  </main>

  <script src="../src/transliterator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
